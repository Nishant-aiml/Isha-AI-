name: Build and Release ISHA AI App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/test_full_system.py -v

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup llama.cpp
        run: |
          rm -rf third_party/llama.cpp
          git clone --depth 1 --branch b4966 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Tools & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isha-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop-bundle:
    name: Package Desktop Application Bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Application ZIP
        run: |
          zip -r isha-ai-app-desktop.zip backend frontend run_isha.py run_isha.bat run_isha.ps1 requirements.txt README.md

      - name: Upload Desktop Bundle
        uses: actions/upload-artifact@v4
        with:
          name: isha-ai-desktop-bundle
          path: isha-ai-app-desktop.zip

  create-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-android, build-desktop-bundle]
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: isha-ai-android-apk
          path: release_assets/

      - name: Download Desktop Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: isha-ai-desktop-bundle
          path: release_assets/

      - name: Prepare Release Artifacts
        run: |
          cp release_assets/app-debug.apk release_assets/isha-ai-v1.0.0.apk || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "ISHA AI Release v1.0.0"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ISHA AI — Intelligent Speech & Haptic Assistant v1.0.0
            
            ### 📱 Downloadable Packages:
            - **Android APK**: Download [`isha-ai-v1.0.0.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/isha-ai-v1.0.0.apk) (Native offline runtime with C++ arm64-v8a acceleration)
            - **Desktop & Web Bundle**: Download [`isha-ai-app-desktop.zip`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/isha-ai-app-desktop.zip) (Standalone runnable bundle with Google Stitch UI)
            
            ### ✨ Features:
            - **Google Stitch Canvas UI**: Glassmorphic dark/light interface with telemetry, thermal zones, and audio waveform visualization.
            - **Online Live RAG**: Real-time web retrieval via DuckDuckGo and Wikipedia with on-device privacy scrubbing.
            - **Pre-Bundled Knowledge Base**: Kisan Saathi (Agriculture), Swasthya Rakshak (Health), Bharat Vidhi (Legal/Civic), and Shiksha (STEM).
            - **Document Ingestion**: Drag-and-drop parsing for PDF, DOCX, TXT, CSV, JSON with boundary-aware chunking and SHA-256 deduplication.
            - **Multimodal Diagnostics**: Vision diagnostics for crop leaf diseases and medical prescription OCR.
            - **PWA Ready**: 1-click "Install App" on desktop or mobile.
          files: |
            release_assets/isha-ai-v1.0.0.apk
            release_assets/isha-ai-app-desktop.zip
